name: CI

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: attaching_ci
          POSTGRES_USER: attaching
          POSTGRES_PASSWORD: attaching
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://attaching:attaching@127.0.0.1:5432/attaching_ci?serverVersion=16&charset=utf8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: fileinfo, dom, mbstring, xml, xmlwriter, pdo_sqlite, pdo_pgsql

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: composer phpstan -- --no-progress

      - name: Run PHPUnit
        run: composer test -- --no-coverage

      - name: Verify Doctrine schema parity
        run: composer schema:parity

      - name: Run CS check
        run: composer cs:check -- --using-cache=no
