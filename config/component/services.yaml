parameters:
  attachment.storage.local.root_path: '%kernel.project_dir%/var/storage/attachment'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Symfony-native component export surface for host applications.
  App\Attaching\:
    resource: '../../src/'
    exclude:
      - '../../src/DependencyInjection/'
      - '../../src/Entity/'

  App\Attaching\ServiceInterface\Storage\Attachment\AttachmentStorageInterface: '@App\Attaching\Service\Storage\Attachment\LocalAttachmentStorage'
  App\Attaching\ServiceInterface\Storage\Attachment\AttachmentPathGeneratorInterface: '@App\Attaching\Service\Storage\Attachment\AttachmentPathGenerator'
  App\Attaching\ServiceInterface\Storage\Attachment\AttachmentChecksumGeneratorInterface: '@App\Attaching\Service\Storage\Attachment\AttachmentChecksumGenerator'
  App\Attaching\ServiceInterface\Storage\Attachment\AttachmentMimeTypeGuesserInterface: '@App\Attaching\Service\Storage\Attachment\AttachmentMimeTypeGuesser'

  App\Attaching\ServiceInterface\Transfer\Attachment\AttachmentUploadServiceInterface: '@App\Attaching\Service\Transfer\Attachment\AttachmentUploadService'
  App\Attaching\ServiceInterface\Linking\Attachment\AttachmentAttachServiceInterface: '@App\Attaching\Service\Linking\Attachment\AttachmentAttachService'
  App\Attaching\ServiceInterface\Linking\Attachment\AttachmentDetachServiceInterface: '@App\Attaching\Service\Linking\Attachment\AttachmentDetachService'
  App\Attaching\ServiceInterface\Query\Attachment\AttachmentListServiceInterface: '@App\Attaching\Service\Query\Attachment\AttachmentListService'
  App\Attaching\ServiceInterface\Transfer\Attachment\AttachmentDownloadServiceInterface: '@App\Attaching\Service\Transfer\Attachment\AttachmentDownloadService'
  App\Attaching\ServiceInterface\Linking\Attachment\AttachmentDeleteServiceInterface: '@App\Attaching\Service\Linking\Attachment\AttachmentDeleteService'
  App\Attaching\ServiceInterface\Validation\Attachment\AttachmentValidationServiceInterface: '@App\Attaching\Service\Validation\Attachment\AttachmentValidationService'
  App\Attaching\ServiceInterface\Linking\Attachment\AttachmentOwnerPurgeServiceInterface:
    alias: 'App\Attaching\Service\Linking\Attachment\AttachmentOwnerPurgeService'
    public: true
  App\Attaching\ServiceInterface\Linking\Attachment\AttachmentPrimaryLinkResolverServiceInterface:
    alias: 'App\Attaching\Service\Linking\Attachment\AttachmentPrimaryLinkResolverService'
    public: true

  App\Attaching\Service\Storage\Attachment\LocalAttachmentStorage:
    arguments:
      $rootPath: '%attachment.storage.local.root_path%'

  App\Attaching\Service\Validation\Attachment\AttachmentValidationService:
    arguments:
      $maxFileSizeInBytes: '%attachment.upload.max_size%'
      $allowedMediaMimeTypes: '%attachment.upload.allowed_media_mime_types%'
      $allowedDocumentMimeTypes: '%attachment.upload.allowed_document_mime_types%'

  App\Attaching\RepositoryInterface\Persistence\Attachment\AttachmentRepositoryInterface: '@App\Attaching\Repository\Doctrine\Attachment\AttachmentRepository'
  App\Attaching\RepositoryInterface\Persistence\Attachment\AttachmentLinkRepositoryInterface: '@App\Attaching\Repository\Doctrine\Attachment\AttachmentLinkRepository'
