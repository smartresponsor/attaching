doctrine:
  dbal:
    url: 'sqlite:///%kernel.project_dir%/var/attachment.test.sqlite'
  orm:
    enable_native_lazy_objects: true
    entity_managers:
      default:
        auto_mapping: false
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
          Attaching:
            type: attribute
            dir: '%kernel.project_dir%/src/Entity'
            prefix: 'App\Attaching\Entity'
            is_bundle: false
          ObjectingEmbeddable:
            type: attribute
            dir: '%kernel.project_dir%/vendor/objecting/object/src/Embeddable'
            prefix: 'App\Objecting\Embeddable'
            is_bundle: false
